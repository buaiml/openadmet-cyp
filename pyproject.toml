[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openadmet-cyp"
authors = [
    {name = "Denali Schlesinger", email = "dsch28@bu.edu"},
]
description = "Code for OpenADMET CYP Inhibition Blind Challenge"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version", "dependencies"]

[project.scripts]
download-data = "data_tools.data_cli:download_all"
evaluate-models = "models.evaluate:main"
plot-results = "models.plot_results:main"
train-unimol = "models.train_unimol:main"
train-model = "models.train_model:main"
motif-report = "data_tools.motif_report:main"
representations = "data_tools.representations_cli:main"
foundation-model = "models.foundation_model:main"
data = "data_tools.data_cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = "tests"
