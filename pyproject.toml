[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openadmet-cyp"
authors = [
    {name = "Denali Schlesinger", email = "dsch28@bu.edu"},
]
description = "Code for OpenADMET CYP Inhibition Blind Challenge"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version", "dependencies"]

[project.scripts]
download-data = "data_tools.download:main"
evaluate-models = "models.evaluate:main"
generate-results = "models.predict:main"
train-chemprop = "models.train_chemprop:main"
build-family-datasets = "data_tools.family_datasets:main"
build-pubchem-aux = "data_tools.pubchem:main"
build-union = "data_tools.build_union:main"
check-overlap = "data_tools.overlap:main"
add-split-column = "data_tools.split_column:main"
head-search = "models.head_search:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = "tests"
